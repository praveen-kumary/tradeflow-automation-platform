[project]
name = "trade-automation-backend"
version = "0.1.0"
description = "Microservices-lite backend for automated trading."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "pandas-ta-classic>=0.4.47",
  "pydantic-settings>=2.6.0",
  "redis>=5.1.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
